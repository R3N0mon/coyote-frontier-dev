# Shuttle Notes:
# Coyote - Pricing Adjustment

- type: vessel
  id: Courier
  parent: BaseVessel
  name: LL1 Courier
  description: A compact cargo ship designed for hauling shipments.
  price: 48000 # Coyote pricing GridAppraisal 26673.36 + LL1 x1.1 + TileCost 19000(152x125) = 48340.696
  category: Small
  group: Shipyard
  shuttlePath: /Maps/_NF/Shuttles/courier.yml
  guidebookPage: ShipyardCourier
  class:
  - Cargo
  engine:
  - Plasma

- type: gameMap
  id: Courier
  mapName: 'FSB Courier'
  mapPath: /Maps/_NF/Shuttles/courier.yml
  minPlayers: 0
  stations:
    Courier:
      stationProto: StandardFrontierVessel
      components:
        - type: StationNameSetup
          mapNameTemplate: 'Courier {1}'
          nameGenerator:
            !type:NanotrasenNameGenerator
            prefixCreator: '14'
        - type: StationJobs
          availableJobs:
            ContractorInterview: [ 0, 0 ]
            PilotInterview: [ 0, 0 ]
            MercenaryInterview: [ 0, 0 ]
