- type: vessel
  id: Retort
  parent: BaseVessel
  name: LL1 Retort
  description: A medium gas mining and engineering vessel designed and deployed by the Far Star Biotech corporation to provide infrastructure support for deep space operations.
  price: 101000 # Coyote pricing GridAppraisal 40925.36 + LL1 x1.2 + TileCost 51875(415x125) = 100985.432
  category: Medium
  group: Shipyard
  shuttlePath: /Maps/_NF/Shuttles/retort.yml
  guidebookPage: ShipyardRetort
