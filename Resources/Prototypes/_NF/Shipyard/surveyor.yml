# Shuttle Notes:
# Coyote - Remove wall EVA lockers, Remove Ore Bags, Remove Metal Benches, Remove Appraisal Gun, Added 2 Salvage Lockers With Hardsuits

- type: vessel
  id: Surveyor
  parent: BaseVessel
  name: LL1 Surveyor
  description: A budget mining and recovery shuttle for corporations unwilling to operate outside of a shoestring budget. Brought to you by the Far Star Biotech corporation!
  price: 34500 # Coyote pricing GridAppraisal 15809.86 + LL1 x1.2 + TileCost 15,500(124x125) = 34471.832
  category: Small
  group: Shipyard
  shuttlePath: /Maps/_NF/Shuttles/surveyor.yml
  guidebookPage: ShipyardSurveyor
  class:
  - Salvage
  engine:
  - Plasma

- type: gameMap
  id: Surveyor
  mapName: 'FSB Surveyor'
  mapPath: /Maps/_NF/Shuttles/surveyor.yml
  minPlayers: 0
  stations:
    Surveyor:
      stationProto: StandardFrontierVessel
      components:
        - type: StationNameSetup
          mapNameTemplate: 'Surveyor {1}'
          nameGenerator:
            !type:NanotrasenNameGenerator
            prefixCreator: '14'
        - type: StationJobs
          availableJobs:
            ContractorInterview: [ 0, 0 ]
            PilotInterview: [ 0, 0 ]
            MercenaryInterview: [ 0, 0 ]
