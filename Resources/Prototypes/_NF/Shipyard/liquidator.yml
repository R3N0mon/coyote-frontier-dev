- type: vessel
  id: Liquidator
  parent: BaseVessel
  name: LL1 Liquidator
  description: A small shipbreaker/salvage vessel equipped with everything a small crew need for extended work shift in deep space. Manufactured by Langstad-Voigt Heavy Industries.
  price: 47000 # Coyote pricing GridAppraisal 20416.86 + LL1 x1.2 + TileCost 22375(179x125) = 46875.232
  category: Small
  group: Shipyard
  shuttlePath: /Maps/_NF/Shuttles/liquidator.yml
  guidebookPage: ShipyardLiquidator
  class:
  - Salvage
  - Cargo
  engine:
  - Uranium

- type: gameMap
  id: Liquidator
  mapName: 'Liquidator'
  mapPath: /Maps/_NF/Shuttles/liquidator.yml
  minPlayers: 0
  stations:
    Liquidator:
      stationProto: StandardFrontierVessel
      components:
        - type: StationNameSetup
          mapNameTemplate: 'Liquidator {1}'
          nameGenerator:
            !type:NanotrasenNameGenerator
            prefixCreator: '14'
        - type: StationJobs
          availableJobs:
            ContractorInterview: [ 0, 0 ]
            PilotInterview: [ 0, 0 ]
            MercenaryInterview: [ 0, 0 ]
