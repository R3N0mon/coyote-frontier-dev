- type: vessel
  id: Loader
  parent: BaseVessel
  name: LL0 Loader
  description: A compact cargo ship designed for hauling shipments.
  price: 35000 # Coyote pricing GridAppraisal 22113.36 + LL0 x1.05 + TileCost 11800(118x100) = 35019.028
  category: Small
  group: Shipyard
  shuttlePath: /Maps/_NF/Shuttles/loader.yml
  guidebookPage: ShipyardLoader
  class:
  - Cargo
  engine:
  - Plasma

- type: gameMap
  id: Loader
  mapName: 'NC Loader'
  mapPath: /Maps/_NF/Shuttles/loader.yml
  minPlayers: 0
  stations:
    Loader:
      stationProto: StandardFrontierVessel
      components:
        - type: StationNameSetup
          mapNameTemplate: 'Loader {1}'
          nameGenerator:
            !type:NanotrasenNameGenerator
            prefixCreator: '14'
        - type: StationJobs
          availableJobs:
            ContractorInterview: [ 0, 0 ]
            PilotInterview: [ 0, 0 ]
            MercenaryInterview: [ 0, 0 ]
