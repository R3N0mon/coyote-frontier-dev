- type: vessel
  id: Disciple
  parent: BaseVessel
  name: LL0 Disciple
  description: A cheaply made amalgamation of religious ships. For the seasoned religious assistant.
  price: 17500 # Coyote pricing GridAppraisal 5525.75 + LL0 x1.05 + TileCost 11500(115x100) = 17302.0375
  category: Small
  group: Scrap
  shuttlePath: /Maps/_NF/Shuttles/Scrap/disciple.yml
  guidebookPage: Null
  class:
  - Scrapyard
  - Civilian
  engine:
  - Plasma

- type: gameMap
  id: Disciple
  mapName: 'NSV Disciple'
  mapPath: /Maps/_NF/Shuttles/Scrap/disciple.yml
  minPlayers: 0
  stations:
    Disciple:
      stationProto: StandardFrontierVessel
      components:
        - type: StationNameSetup
          mapNameTemplate: 'Disciple {1}'
          nameGenerator:
            !type:NanotrasenNameGenerator
            prefixCreator: '14'
        - type: StationJobs
          availableJobs:
            ContractorInterview: [ 0, 0 ]
            PilotInterview: [ 0, 0 ]
            MercenaryInterview: [ 0, 0 ]
