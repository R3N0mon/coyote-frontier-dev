- type: vessel
  id: Crossroads
  parent: BaseVessel
  name: LL1 Crossroads
  description: "A spacious and inviting service ship. The crossroads is designed to help with dock crowding, connect communities, and serve as anchors for gatherings."
  price: 129500 # Coyote pricing GridAppraisal 54196.36 + LL1 x1.15 + 69750(558x125) = 129365.996
  category: Medium
  group: Shipyard
  shuttlePath: /Maps/_NF/Shuttles/crossroads.yml
  guidebookPage: ShipyardCrossroads
  class:
  - Civilian
  engine:
  - Uranium

- type: gameMap
  id: Crossroads
  mapName: 'PHI Crossroads'
  mapPath: /Maps/_NF/Shuttles/crossroads.yml
  minPlayers: 0
  stations:
    Crossroads:
      stationProto: StandardFrontierVessel
      components:
        - type: StationNameSetup
          mapNameTemplate: 'Crossroads {1}'
          nameGenerator:
            !type:NanotrasenNameGenerator
            prefixCreator: '14'
        - type: StationJobs
          availableJobs:
            ContractorInterview: [ 0, 0 ]
            PilotInterview: [ 0, 0 ]
            MercenaryInterview: [ 0, 0 ]
