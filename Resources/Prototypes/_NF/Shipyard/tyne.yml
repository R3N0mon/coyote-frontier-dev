- type: vessel
  id: Tyne
  parent: BaseVessel
  name: LL0 Tyne
  description: A small, agile lifeboat with an exterior deck and survivor cabin for search and rescue operations.
  price: 28000 # Coyote pricing GridAppraisal 16437.36 + LL0 x1.05 + TileCost 10800(108x100) = 28059.228
  category: Small
  group: Medical
  shuttlePath: /Maps/_NF/Shuttles/tyne.yml
  class:
  - Medical
  engine:
  - Plasma

- type: gameMap
  id: Tyne
  mapName: 'BB Tyne'
  mapPath: /Maps/_NF/Shuttles/tyne.yml
  minPlayers: 0
  stations:
    Tyne:
      stationProto: StandardFrontierVessel
      components:
        - type: StationNameSetup
          mapNameTemplate: 'Tyne {1}'
          nameGenerator:
            !type:NanotrasenNameGenerator
            prefixCreator: '14'
        - type: StationJobs
          availableJobs:
            ContractorInterview: [ 0, 0 ]
            PilotInterview: [ 0, 0 ]
            MercenaryInterview: [ 0, 0 ]
